<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Poem Generator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Poem Generator 📝</h1>
      </header>
      <main>
        <form>
          <input
            type="text"
            placeholder="Enter topic of poem"
            autofocus
            required
            autocomplete="off"
            class="poem-topic"
          />
          <input type="submit" class="submit-button" />
        </form>

        <p class="poem">Poem!</p>
      </main>
      <footer>
        This AI project was coded by
        <a href="https://github.com/mabotejuliet-16" target="_blank"
          >Ntaoleng.J Mabote</a
        >
        and is
        <a
          href="https://github.com/mabotejuliet-16/Poem-Generator"
          target="_blank"
          >open-sourced on GitHub</a
        >
        and is
        <a href="https://ai-poem-generator12.netlify.app/" target="_blank"
          >hosted on Netlify</a
        >
      </footer>
    </div>
    <script src="script.js"></script>
  </body>
</html>
